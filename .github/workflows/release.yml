name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run tests
        run: make test

      - name: Smoke checked-in examples
        run: make smoke-examples

      - name: Generate compatibility manifest
        run: make compatibility-manifest

      - name: Validate release documentation and run closed-form oracles
        run: make validate-v1-release-docs oracle-suite

      - name: Build release archives
        run: make release-build APP_VERSION=${APP_VERSION#v}

      - name: Package default config pack
        run: make default-config-pack APP_VERSION=${APP_VERSION#v}

      - name: Run fixed benchmark slice
        run: make benchmark-slice BENCHMARK_OUT_DIR=dist/benchmark-slice

      - name: Publish OCI image
        run: |
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPOSITORY="ghcr.io/${OWNER_LC}/sheaft" \
          APP_VERSION="${APP_VERSION#v}" \
          PUBLISH=true \
          sh scripts/release/build-image.sh

      - name: Publish OCI chart
        run: |
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          CHART_OCI_REPOSITORY="oci://ghcr.io/${OWNER_LC}/charts" \
          APP_VERSION="${APP_VERSION#v}" \
          CHART_VERSION="${APP_VERSION#v}" \
          PUBLISH=true \
          sh scripts/release/package-chart.sh

      - name: Generate release manifest
        run: make release-manifest APP_VERSION=${APP_VERSION#v}

      - name: Validate release assets
        run: make validate-release-assets

      - name: Resolve release notes file
        id: release_notes
        run: |
          NOTES_FILE="release/${APP_VERSION}.md"
          if [ -f "${NOTES_FILE}" ]; then
            echo "file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.release_notes.outputs.file }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="Sheaft ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ -n "${NOTES_FILE}" ]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
            else
              gh release edit "${TAG}" --title "${TITLE}" --notes "Canonical release metadata lives in dist/ and release-manifest.json."
            fi
          else
            if [ -n "${NOTES_FILE}" ]; then
              gh release create "${TAG}" --verify-tag --title "${TITLE}" --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" --verify-tag --title "${TITLE}" --notes "Canonical release metadata lives in dist/ and release-manifest.json."
            fi
          fi
          mapfile -t files < <(
            {
              find dist -maxdepth 1 -type f \( \
                -name 'sheaft_*.tar.gz' -o \
                -name 'sheaft_*.zip' -o \
                -name 'sheaft_*.sbom.json' -o \
                -name 'sheaft_*_checksums.txt' -o \
                -name 'sheaft-default-config-pack_*.tar.gz' \
              \)
              find dist/charts -maxdepth 1 -type f -name 'sheaft-*.tgz'
            } | sort
          )
          if [ -f dist/benchmark-slice/quality-report.json ]; then
            files+=("dist/benchmark-slice/quality-report.json")
          fi
          if [ -f .tmp/oracle-suite/oracle-report.json ]; then
            files+=(".tmp/oracle-suite/oracle-report.json")
          fi
          files+=("compatibility-manifest.json")
          files+=("release-manifest.json")
          gh release upload "${TAG}" "${files[@]}" --clobber

  verify-public-release:
    name: Download and run published assets without authentication
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download and verify the public binary and config pack
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 "$base/release-manifest.json" -o release-manifest.json
          test "$(jq -r .git_commit release-manifest.json)" = "$GITHUB_SHA"
          binary=$(jq -r '.binaries[] | select(.os == "linux" and .arch == "amd64") | .archive.path | split("/")[-1]' release-manifest.json)
          binary_hash=$(jq -r '.binaries[] | select(.os == "linux" and .arch == "amd64") | .archive.sha256' release-manifest.json)
          pack=$(jq -r '.default_config_packs[0].archive.path | split("/")[-1]' release-manifest.json)
          pack_hash=$(jq -r '.default_config_packs[0].archive.sha256' release-manifest.json)
          curl --fail --location --retry 3 "$base/$binary" -o "$binary"
          curl --fail --location --retry 3 "$base/$pack" -o "$pack"
          echo "$binary_hash  $binary" | sha256sum -c -
          echo "$pack_hash  $pack" | sha256sum -c -
          tar -xzf "$binary"
          tar -xzf "$pack" --strip-components=1
          ./sheaft help
          ./sheaft run --model examples/outputs/model.required-calls.sample.json --analysis configs/analysis.required-calls.example.yaml --out-dir out/binary
      - name: Pull and execute the published image anonymously
        shell: bash
        run: |
          set -euo pipefail
          image=$(jq -r '.oci_images[0] | .repository + "@" + .digest' release-manifest.json)
          docker pull "$image"
          docker run --rm --user 0:0 --mount "type=bind,source=$PWD,target=/data" "$image" run --model /data/examples/outputs/model.required-calls.sample.json --analysis /data/configs/analysis.required-calls.example.yaml --out-dir /data/out/image
          jq -S '.endpoint_results' out/binary/report.json > binary-endpoints.json
          jq -S '.endpoint_results' out/image/report.json > image-endpoints.json
          diff -u binary-endpoints.json image-endpoints.json
