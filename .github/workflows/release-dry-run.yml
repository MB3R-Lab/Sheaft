name: release-dry-run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-release-surface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Smoke checked-in examples
        run: make smoke-examples

      - name: Resolve tested Bering app version
        id: bering-compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          manifest = json.loads(Path("compatibility-manifest.json").read_text(encoding="utf-8"))
          versions = manifest.get("tested_bering_app_versions", [])
          if len(versions) != 1 or not isinstance(versions[0], str):
              raise SystemExit("compatibility manifest must declare exactly one tested Bering app version")
          tag = versions[0]
          if not tag.startswith("v") or len(tag) == 1:
              raise SystemExit(f"invalid tested Bering app version: {tag!r}")
          print(f"tag={tag}")
          print(f"version={tag[1:]}")
          PY

      - name: Download published Bering compatibility assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BERING_TAG: ${{ steps.bering-compatibility.outputs.tag }}
          BERING_VERSION: ${{ steps.bering-compatibility.outputs.version }}
        run: |
          set -euo pipefail
          destination=".tmp/bering-app-compatibility"
          mkdir -p "${destination}"
          gh release download "${BERING_TAG}" \
            --repo MB3R-Lab/Bering \
            --pattern release-manifest.json \
            --pattern "bering-contracts_${BERING_VERSION}.tar.gz" \
            --dir "${destination}"

      - name: Verify published Bering app compatibility
        shell: bash
        env:
          BERING_VERSION: ${{ steps.bering-compatibility.outputs.version }}
        run: |
          set -euo pipefail
          make check-bering-app-compatibility \
            BERING_APP_VERSION="${BERING_VERSION}" \
            BERING_RELEASE_MANIFEST=.tmp/bering-app-compatibility/release-manifest.json \
            BERING_CONTRACTS_ARCHIVE=".tmp/bering-app-compatibility/bering-contracts_${BERING_VERSION}.tar.gz"

      - name: Validate release dry-run
        run: |
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          make release-dry-run APP_VERSION=0.0.0-dev IMAGE_REPOSITORY=ghcr.io/${OWNER_LC}/sheaft

      - name: Validate default config pack generation
        run: sh scripts/ci/check-default-config-pack.sh

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sheaft-release-dry-run
          path: |
            dist/**
            compatibility-manifest.json
            release-manifest.json
            charts/sheaft/**
            .tmp/bering-app-compatibility/**
            .tmp/smoke-examples/**
            .tmp/benchmark-slice/**
          if-no-files-found: error
          retention-days: 3
