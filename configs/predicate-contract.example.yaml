schema_version: "1.0"

predicates:
  catalog.checkout.success:
    type: all_of
    services:
      - checkout
      - inventory
  frontend:GET /checkout:
    type: all_of
    services:
      - frontend
      - checkout
      - inventory
  frontend:GET /health:
    type: all_of
    services:
      - frontend
  checkout:eventual_completion:
    type: edge_aware
    entry_service: frontend
    mandatory_targets:
      - payment
    edge_modes:
      - sync
      - async

endpoint_weights:
  checkout:POST /process: 0.6
  frontend:GET /checkout: 0.4
